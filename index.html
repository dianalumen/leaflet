<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leaflet</title>
<meta name="description" content="Zobacz, ile robisz dla siebie.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leaflet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&family=Onest:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Leaflet: one phone column, saturated cards, ink pills, floating tab bar. Light and dark tokens; accent is user-chosen. */
:root{
  --accent:#FFD84D; --on-c:#141414;
  --f-sans:"Instrument Sans","Onest","Helvetica Neue",system-ui,sans-serif;
  --f-it:"Instrument Serif","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --bg:#FFFFFF; --bg2:#FFFFFF; --soft:#F4F3EF; --ink:#141414; --on-ink:#FFFFFF; --muted:#77756E; --line:#E9E7E1; --ring0:#ECEAE4; --faint:#C9C7C0;
  --ic:#FFFFFF; --bar:#141414; --stem:#141414; --danger:#C8323A; --leaf:#3E8F2E; --ground:#F0EEE8;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#121211; --bg2:#1C1B19; --soft:#22211E; --ink:#F2F0EA; --on-ink:#141414; --muted:#A6A39B; --line:#34332F; --ring0:#2F2E2A; --faint:#5C5A55;
  --ic:#33322E; --bar:#2A2926; --stem:#E9E7E1; --danger:#FF8A8A; --leaf:#A6D86B; --ground:#1E1D1B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);transition:background .3s,color .3s}
body{font-family:var(--f-sans);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
em{font-family:var(--f-it);font-style:italic;font-weight:400;letter-spacing:0}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(118px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.view.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1)}
.view.fwd{animation:fwd .42s cubic-bezier(.2,.8,.2,1)}
.view.bwd{animation:bwd .42s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes fwd{from{opacity:0;transform:translateX(36px)}}
@keyframes bwd{from{opacity:0;transform:translateX(-36px)}}

.eyebrow{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.ttl{font-size:34px;line-height:1.04;font-weight:500;letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
.ttl em{font-size:1.06em}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .15s}
.round:active{transform:scale(.9)}
.round svg{width:18px;height:18px}
.round:disabled{opacity:.3}

.demo{display:flex;align-items:center;gap:10px;background:var(--bar);color:#fff;border-radius:999px;padding:6px 6px 6px 16px;font-size:14px;font-weight:500}
.demo span{flex:1;min-width:0}
.demo button{border:0;background:var(--accent);color:#141414;border-radius:999px;padding:8px 14px;font-weight:600}

.week{display:flex;align-items:center;gap:2px}
.week .round{width:28px;height:28px;background:transparent}
.week .round svg{width:16px;height:16px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{border:0;background:transparent;border-radius:999px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.wd:active{transform:scale(.92)}
.wd .rg{position:relative;width:34px;height:34px;display:grid;place-items:center}
.wd .rg svg{position:absolute;inset:0}
.wd .rg b{font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.wd[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wd[aria-pressed="true"] .rg b{color:var(--bg)}
.wd:disabled{opacity:.35}

.hero{background:var(--accent);color:#141414;border-radius:26px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:background .3s}
.hero svg.wk{width:66px;height:66px;flex:none}
.hero .big{font-size:40px;font-weight:600;line-height:.9;letter-spacing:-.03em;display:flex;align-items:baseline;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;font-weight:500;margin-left:2px}
.hero .cap{font-size:13px;font-weight:500;margin-top:4px}
.streak{margin-left:auto;border:0;background:#141414;color:#fff;border-radius:999px;padding:8px 12px 8px 10px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;flex:none;transition:transform .15s}
.streak:active{transform:scale(.94)}
.streak svg{width:18px;height:18px;color:var(--accent)}
.odo{display:inline-grid;overflow:hidden;vertical-align:bottom}
.odo>span{grid-area:1/1}
.odo .o-old{animation:oOut .38s cubic-bezier(.4,0,.2,1) forwards}
.odo .o-new{animation:oIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes oOut{to{transform:translateY(-100%);opacity:0}}
@keyframes oIn{from{transform:translateY(100%);opacity:0}}

.cards{display:flex;flex-direction:column;gap:8px}
.card{position:relative;overflow:hidden;border:0;width:100%;display:flex;align-items:center;gap:12px;border-radius:24px;padding:10px 12px 10px 10px;background:var(--soft);color:var(--ink);text-align:left;font-size:17px;font-weight:600;-webkit-touch-callout:none;transition:transform .18s cubic-bezier(.3,1.6,.5,1),color .25s}
.card:active{transform:scale(.975)}
.card .fill{position:absolute;inset:0;background:var(--c);clip-path:circle(0% at var(--x,90%) var(--y,50%));transition:clip-path .5s cubic-bezier(.3,.7,.2,1)}
.card[aria-pressed="true"]{color:var(--on-c)}
.card[aria-pressed="true"] .fill{clip-path:circle(150% at var(--x,90%) var(--y,50%))}
.card>*:not(.fill):not(.spark){position:relative}
.card .ic{width:44px;height:44px;border-radius:50%;background:var(--ic);display:grid;place-items:center;flex:none;transition:background .25s}
.card[aria-pressed="true"] .ic{background:#fff}
.card .ic svg{width:22px;height:22px}
.card .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.card .ck{width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;flex:none;transition:background .2s}
.card .ck svg{width:18px;height:18px;color:#fff;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.card[aria-pressed="true"] .ck{background:#141414;border-color:#141414}
.card[aria-pressed="true"] .ck svg{transform:scale(1)}
.mn{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:1px}
.card[aria-pressed="true"] .mn{color:var(--on-c)}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:2}
.addbtn{border:2px dashed var(--line);background:transparent;border-radius:24px;padding:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.addbtn svg{width:18px;height:18px}
.note{width:100%;border:0;background:var(--soft);border-radius:999px;padding:14px 18px;font-size:15px}
.note::placeholder{color:var(--muted)}
.nudge{align-self:flex-start;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.nudge svg{width:16px;height:16px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 2px}
.cal .h{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.cd{border:0;background:transparent;padding:0;display:grid;place-items:center;position:relative;aspect-ratio:1;max-width:100%;transition:transform .15s}
.cd:active{transform:scale(.9)}
.cd svg{position:absolute;inset:6%;width:88%;height:88%}
.cd b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.cd.fut b{color:var(--faint);font-weight:500}
.cd.pre b{color:var(--muted);font-weight:500}
.cd.today::after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.cd .star{position:absolute;top:-1px;right:2px;width:14px;height:14px}
.cd.pop svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px 6px 6px;font-size:14px;font-weight:600;background:var(--c);color:var(--on-c);transition:background .25s,color .25s,transform .15s}
button.chip:active{transform:scale(.95)}
.chip i{width:26px;height:26px;border-radius:50%;background:#fff;color:#141414;display:grid;place-items:center}
.chip i svg{width:15px;height:15px}
.chip.off{background:var(--soft);color:var(--muted)}
.chip.off i{background:var(--ic);color:var(--muted)}
.tile{border-radius:22px;padding:14px;background:var(--soft)}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500}
.tile .k{font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
.tile.pink{background:#FF7EB6;color:#141414}.tile.blue{background:#8FB8FF;color:#141414}
.tile.pink .k,.tile.blue .k{color:#141414}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rits{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px 4px}
.rit{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:0;min-width:0}
.rit .o{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;transition:background .2s,color .2s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.rit .o svg{width:22px;height:22px}
.rit[aria-pressed="true"] .o{background:var(--ink);color:var(--bg);transform:scale(1.06)}
.rit:active .o{transform:scale(.9)}
.rit .t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rit.add .o{border:2px dashed var(--faint);color:var(--muted)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:8px}
.sechead h2{font-size:15px;font-weight:600;margin:0}
.sechead span{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.sched{display:flex;gap:6px;flex-wrap:wrap}
.sched button{border:0;background:var(--soft);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;transition:background .2s,color .2s}
.sched button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wdp{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdp button{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:var(--soft);font-weight:600;font-size:13px}
.wdp button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* plant */
.stage{position:relative;display:grid;place-items:center;padding-top:4px}
.stage svg{width:min(100%,300px);height:auto;display:block;overflow:visible}
.plant{overflow:visible}
.plant .lf{transform-box:fill-box;transform-origin:0% 70%;animation:grow .6s cubic-bezier(.3,1.5,.5,1) both}
.plant .fl{transform-box:fill-box;transform-origin:center;animation:bloom .7s cubic-bezier(.3,1.6,.5,1) both}
.plant .stem{stroke-dasharray:420;stroke-dashoffset:0;animation:stem .8s ease-out both}
.plant.live .sway{animation:sway 5.5s ease-in-out infinite}
.plant .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.plant .zz path{animation:zz 2.6s ease-in-out infinite}
.plant .zz path:nth-child(2){animation-delay:.5s}.plant .zz path:nth-child(3){animation-delay:1s}
.plant .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.plant .tw:nth-of-type(2n){animation-delay:.8s}
.plant .bob{animation:bob 3.2s ease-in-out infinite}
@keyframes grow{from{transform:scale(0)}}
@keyframes bloom{from{transform:scale(0) rotate(-60deg)}}
@keyframes stem{from{stroke-dashoffset:420}}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}35%{opacity:1}100%{opacity:0;transform:translate(4px,-10px)}}
@keyframes tw{0%,100%{transform:scale(.55) rotate(0);opacity:.55}50%{transform:scale(1) rotate(25deg);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.prog{background:var(--soft);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;gap:8px}
.prog .row span:last-child{font-size:14px;color:var(--muted);font-weight:500;text-align:right}
.bar{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--leaf);transform-origin:left;animation:barIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes barIn{from{transform:scaleX(0)}}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pot{background:var(--soft);border-radius:22px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;border:0;color:var(--ink)}
.pot svg{width:100%;height:auto;max-width:110px}
.pot b{font-size:13px;font-weight:600}
.pot span{font-size:12px;color:var(--muted)}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 0}

.group{background:var(--soft);border-radius:24px;padding:6px}
.rowbtn{width:100%;border:0;background:transparent;border-radius:18px;padding:10px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:600}
.rowbtn:active{background:var(--bg)}
.rowbtn .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ic);color:var(--ink);flex:none}
.rowbtn .ic.col{background:var(--c);color:#141414}
.rowbtn .ic.inv{background:var(--ink);color:var(--bg)}
.rowbtn .ic svg{width:19px;height:19px}
.rowbtn .sub{display:block;font-size:13px;color:var(--muted);font-weight:500}
.rowbtn .chev{margin-left:auto;width:16px;height:16px;color:var(--muted)}
.info{font-size:14px;color:var(--muted);padding:2px 6px;margin:0}
.accs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:8px}
.pick.hue6{grid-template-columns:repeat(6,minmax(0,1fr))}
.shades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shades button{border:0;border-radius:16px;height:44px;background:var(--c);color:#141414;font-weight:600;font-size:13px;transition:background .25s,box-shadow .2s}
.shades button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--ink)}
.pinb{align-self:flex-start;border:0;background:var(--soft);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.pinb svg{width:16px;height:16px}
.pinb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card .pn{display:inline-grid;vertical-align:middle;margin-left:6px;opacity:.6}
.card .pn svg{width:14px;height:14px}
.morebtn{align-self:center;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px 8px 10px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;transition:transform .15s}
.morebtn:active{transform:scale(.95)}
.morebtn .chv{display:grid;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.morebtn .chv.up{transform:rotate(180deg)}
.morebtn svg{width:16px;height:16px}
.accs button{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#141414;transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.accs button svg{width:18px;height:18px;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.accs button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--soft),0 0 0 5px var(--ink)}
.accs button[aria-pressed="true"] svg{transform:scale(1)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--bg);border-radius:999px;margin:4px 6px 6px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 4px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:360px;margin:0 auto;background:var(--bar);border-radius:999px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{border:0;background:transparent;color:#fff;height:46px;border-radius:999px;display:grid;place-items:center;transition:background .25s,color .25s,transform .15s}
.tabbar button:active{transform:scale(.9)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{background:var(--accent);color:#141414}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,10,10,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:var(--bg2);color:var(--ink);border-radius:30px 30px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up .32s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0;line-height:1.05}
.sheet p{margin:0;color:var(--muted)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .acts button{flex:1 1 auto}
.btn{border:0;border-radius:999px;padding:15px 18px;font-weight:600;background:var(--soft);color:var(--ink);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.black{background:var(--ink);color:var(--on-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.tin{width:100%;border:0;background:var(--soft);border-radius:999px;padding:14px 18px;font-size:17px;font-weight:600}
.pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pick button{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:transform .15s}
.pick button svg{width:20px;height:20px}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);transform:scale(1.08)}
.swatches button{background:var(--c)}
.swatches button[aria-pressed="true"]{background:var(--c);box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--ink);color:#141414}
.sugg{display:flex;flex-wrap:wrap;gap:6px}

.own{border:2px dashed var(--line);background:transparent;border-radius:24px;padding:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}

function migrate(s){if(!Array.isArray(s.areas))s.areas=['ruch','wyjscia'];if(!s.lang)s.lang='pl';if(!s.theme)s.theme={accent:0,mode:'light'};if(!s.rituals)s.rituals=defRits();return s}

function demo(){
  const s=fresh();s.demo=true;let seed=11;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const t=today();
  for(let i=110;i>=1;i--){const k=add(t,-i);const a={};const x=r();
    if(x<.26)a.rower={};else if(x<.44)a.silownia={};else if(x<.56)a.basen={};
    const dow=parse(k).getDay(); if((dow===0||dow===6)&&r()<.55)a[r()<.75?'wedrowka':'wycieczka']={};
    if(r()<.12)a[['basen','rower','silownia'][Math.floor(r()*3)]]={};
    if(Object.keys(a).length)s.days[k]={acts:a}}
  s.days[add(t,-1)]={acts:{rower:{},wedrowka:{}},note:'Kampinos, 24 km'};
  s.meta.created=parse(add(t,-115)).getTime();
  for(let i=110;i>=1;i--){const k=add(t,-i);const rt={};const w=(parse(k).getDay()+6)%7;if(r()<.85)rt.zeby=1;if(w<5&&r()<.6)rt.portfolio=1;if(Object.keys(rt).length){s.days[k]=s.days[k]||{};s.days[k].rit=rt}}

}

/* data helpers */

const actById=id=>S.activities.find(a=>a.id===id);
function setDay(k,fn){const d=JSON.parse(JSON.stringify(day(k)));fn(d);if(d.acts&&!Object.keys(d.acts).length)delete d.acts;if(d.rit&&!Object.keys(d.rit).length)delete d.rit;if(d.note!=null&&!String(d.note).trim())delete d.note;if(!d.acts&&!d.note&&!d.rit)delete S.days[k];else S.days[k]=d;save()}
const wdi=k=>(parse(k).getDay()+6)%7;
const ritsFor=k=>(S.rituals||[]).filter(r=>r.days.includes(wdi(k)));
const ritDone=k=>{const r=day(k).rit||{};return ritsFor(k).filter(x=>r[x.id]).length};

function ritRate(ym){let tot=0,dn=0;const dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();for(let d=1;d<=dim;d++){const k=ym+'-'+pad(d);if(k>today())break;if(S.meta.created&&k<keyOf(new Date(S.meta.created))&&!S.days[k])continue;tot+=ritsFor(k).length;dn+=ritDone(k)}return tot?dn/tot:null}
function streak(){let k=today();if(!nActs(k))k=add(k,-1);let n=0,gap=0;for(let i=0;i<4000;i++){if(nActs(k)){n++;gap=0}else{gap++;if(gap>=2)break}k=add(k,-1)}return n}

/* visuals */
function ring(colors,size,sw,empty='var(--ring0)',inner=null,ink='var(--ink)'){
  const r=(size-sw)/2,c=size/2,C=2*Math.PI*r,n=colors.length;
  let s=`<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  if(inner!=null){const isw=Math.max(2.2,sw*.55),ir=r-sw/2-isw/2-1.6,IC2=2*Math.PI*ir;s+=`<circle cx="${c}" cy="${c}" r="${ir}" fill="none" style="stroke:${empty}" stroke-width="${isw}"/>`;if(inner>0)s+=`<circle cx="${c}" cy="${c}" r="${ir}" fill="none" style="stroke:${ink}" stroke-width="${isw}" stroke-linecap="round" stroke-dasharray="${(IC2*Math.min(1,inner)).toFixed(2)} ${IC2.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`}
  if(!n) s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${empty}" stroke-width="${sw}"/>`;
  else if(n===1) s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${colors[0]}" stroke-width="${sw}"/>`;
  else{const gap=Math.min(2.2,C/n*.2),seg=C/n-gap;colors.forEach((col,i)=>{s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${seg.toFixed(2)} ${C.toFixed(2)}" transform="rotate(${-90+i*360/n+gap/C*180} ${c} ${c})"/>`})}
  return s+'</svg>';
}
function weekRing(wk){
  const size=66,sw=10,r=(size-sw)/2,c=size/2,C=2*Math.PI*r,gap=3,seg=C/7-gap;let s=`<svg class="wk" viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  wk.forEach((on,i)=>{s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${on?'#141414':'rgba(20,20,20,.16)'}" stroke-width="${sw}" stroke-dasharray="${seg.toFixed(2)} ${C.toFixed(2)}" transform="rotate(${-90+i*360/7+gap/C*180} ${c} ${c})" style="transition:stroke .3s"/>`});
  return s+'</svg>';

/* PLANT: chunky shapes with flat cel shading (shadow band in a darker shade + soft highlight), face on the pot with a mood */

function flowerG(x,y,r){const pc='#FF9A5C',ps=shade(pc,.18);let s='';
  for(let i=0;i<6;i++){const a=i*Math.PI/3;s+=`<circle cx="${(x+Math.cos(a)*r*.95+1.2).toFixed(1)}" cy="${(y+Math.sin(a)*r*.95+1.8).toFixed(1)}" r="${r*.62}" fill="${ps}"/>`}
  for(let i=0;i<6;i++){const a=i*Math.PI/3;s+=`<circle cx="${(x+Math.cos(a)*r*.95).toFixed(1)}" cy="${(y+Math.sin(a)*r*.95).toFixed(1)}" r="${r*.62}" fill="${pc}"/>`}
  return s+`<circle cx="${x}" cy="${y}" r="${r*.6}" fill="#FFD84D"/><path d="M${x-r*.6} ${y} a${r*.6} ${r*.6} 0 0 0 ${r*1.2} 0z" fill="${shade('#FFD84D',.14)}"/><circle cx="${x-r*.2}" cy="${y-r*.22}" r="${r*.16}" fill="#fff" opacity=".7"/>`}
const sparkP=(x,y,s)=>`<path class="tw" d="M${x} ${y-7*s} Q${x+1} ${y-1*s} ${x+7*s} ${y} Q${x+1} ${y+1*s} ${x} ${y+7*s} Q${x-1} ${y+1*s} ${x-7*s} ${y} Q${x-1} ${y-1*s} ${x} ${y-7*s}Z" style="fill:var(--ink)"/>`;
function drawPlant(o){

  const W2=220,H=298,base=222,n=leaves.length,id='pl'+(++UID);

  s+=`<ellipse cx="110" cy="${H-12}" rx="58" ry="5.5" style="fill:var(--ground)"/>`;
  s+=`<g class="sway" style="transform-origin:110px ${base}px">`;
  if(!n){s+=`<path d="M110 ${base} Q112 ${base-14} 110 ${base-26}" style="stroke:var(--stem)" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    s+=`<g transform="translate(110 ${base-24}) rotate(-32)"><g ${A('lf',100)}>${leafG(24,'#A6D86B')}</g></g><g transform="translate(110 ${base-22}) rotate(212) scale(1,-1)"><g ${A('lf',180)}>${leafG(20,'#6FDCC0')}</g></g>`}

  const cx=110,ey=base+25,K='#141414';

  else if(mood==='star')s+=[cx-13,cx+13].map(x=>`<path d="M${x} ${ey-7} Q${x+1} ${ey-1} ${x+7} ${ey} Q${x+1} ${ey+1} ${x} ${ey+7} Q${x-1} ${ey+1} ${x-7} ${ey} Q${x-1} ${ey-1} ${x} ${ey-7}Z" fill="${K}"/>`).join('')+`<path d="M${cx-9} ${ey+10} q9 12 18 0z" fill="${K}"/>`;
  else s+=`<g class="blink"><ellipse cx="${cx-13}" cy="${ey}" rx="4" ry="5.2" fill="${K}"/><ellipse cx="${cx+13}" cy="${ey}" rx="4" ry="5.2" fill="${K}"/><circle cx="${cx-11.5}" cy="${ey-2}" r="1.4" fill="#fff"/><circle cx="${cx+14.5}" cy="${ey-2}" r="1.4" fill="#fff"/></g><path d="M${cx-7} ${ey+11} q7 7 14 0" stroke="${K}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if(sun||mood==='star')s+=`<circle cx="${cx-25}" cy="${ey+9}" r="5" fill="#FF7EB6" opacity=".6"/><circle cx="${cx+25}" cy="${ey+9}" r="5" fill="#FF7EB6" opacity=".6"/>`;
  if(mood==='sleep')s+=`<g class="zz" style="stroke:var(--ink)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M150 ${base-22} h7 l-7 8 h7"/><path d="M163 ${base-40} h9 l-9 10 h9"/><path d="M178 ${base-62} h11 l-11 12 h11"/></g>`;
  if(blooms)s+=sparkP(40,top+10,.9)+sparkP(176,top+40,.7)+sparkP(58,top-24,.6);

function plantSVG(ym,{animate=false,live=false}={}){
  const rr=ritRate(ym),sun=rr!=null&&rr>=.8,ks=monthDays(ym),n=ks.length;
  const leaves=ks.map(k=>{const a=actsOf(k);return{col:colorOf(a[0]),big:a.length>1}});
  const blooms=n>=28?3:n>=25?2:n>=BLOOM?1:0;
  const isCur=ym===today().slice(0,7);
  let mood=n?(blooms?'star':'happy'):'sleep';
  if(isCur&&n&&!nActs(today())&&!nActs(add(today(),-1)))mood='sleep';
  return drawPlant({leaves,blooms,sun,mood,animate,live,pot:accentHex(),aria:`${mNom(ym)}: ${P(n,'f_leaf')}`});
}

/* ui helpers */

  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,''))}"><div class="grab"></div><h3>${title}</h3>${body}<div class="acts"></div></div>`;
  const row=sc.querySelector('.acts');const close=()=>{sc.remove()};
  actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.kind||'');b.textContent=a.label;b.onclick=()=>{if(a.fn&&a.fn(sc)===false)return;close()};row.appendChild(b)});
  sc.addEventListener('click',e=>{if(e.target===sc)close()});
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  document.body.appendChild(sc);onOpen&&onOpen(sc);return sc;
}
let tt;function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),2400)}

function applyImport(obj){

  const rits=Array.isArray(obj.rituals)?obj.rituals.filter(r=>r&&r.id&&r.name&&Array.isArray(r.days)).map(r=>({id:r.id,name:String(r.name).slice(0,24),icon:IC[r.icon]?r.icon:'sun',days:r.days.filter(d=>d>=0&&d<7)})):null;
  const acts=(obj.activities||[]).filter(a=>a&&a.id&&a.name).map((a,i)=>({id:a.id,name:String(a.name).slice(0,24),icon:IC[a.icon]?a.icon:'sun',c:Number.isInteger(a.c)||(typeof a.c==='string'&&HEX.test(a.c))?a.c:i%COLORS.length,pin:!!a.pin,min:+a.min>0&&+a.min<=600?Math.round(+a.min):0}));
  const cnt=Object.keys(days).length;
  const replace=()=>{const keep={lang:S.lang,theme:S.theme};S=fresh();Object.assign(S,keep);if(Array.isArray(obj.areas))S.areas=obj.areas.filter(id=>AREAS.some(a=>a.id===id));if(acts.length)S.activities=acts;if(rits)S.rituals=rits;S.days=days;if(obj.meta&&obj.meta.lastBackup)S.meta.lastBackup=obj.meta.lastBackup;relabel();save();view=view==='onb'?'today':view;render(true);toast(_('loaded',P(cnt,'f_day')))};
  const merge=()=>{if(Array.isArray(obj.areas))obj.areas.forEach(id=>{if(AREAS.some(a=>a.id===id)&&!S.areas.includes(id))S.areas.push(id)});acts.forEach(a=>{if(!actById(a.id))S.activities.push(a)});(rits||[]).forEach(r=>{if(!ritById(r.id))S.rituals.push(r)});Object.entries(days).forEach(([k,d])=>{const e=S.days[k]||{};S.days[k]={...d,...e,acts:{...(d.acts||{}),...(e.acts||{})},rit:{...(d.rit||{}),...(e.rit||{})}};if(!Object.keys(S.days[k].acts).length)delete S.days[k].acts;if(!Object.keys(S.days[k].rit).length)delete S.days[k].rit});relabel();save();render(true);toast(_('merged'))};

}

     <div class="ars">${AREAS.map((a,i)=>`<button class="ar rise" style="--c:${COLORS[a.c]};--d:${80+i*45}ms" data-ar="${a.id}" aria-pressed="${OB.areas.includes(a.id)}"><span class="fill"></span><span class="ic">${IC[a.icon]}</span><span class="nm">${NM(a.id)}</span><span class="ck">${UI.check}</span></button>`).join('')}</div>
     <div class="obbar"><button class="btn black" id="ob-n">${_('next')}</button>${dots}</div></div>`;
    v.querySelectorAll('[data-ar]').forEach(b=>{b.addEventListener('pointerdown',e=>pour(b,e));b.onclick=()=>{const id=b.dataset.ar,on=!OB.areas.includes(id);OB.areas=on?[...OB.areas,id]:OB.areas.filter(x=>x!==id);b.setAttribute('aria-pressed',on)}});
    v.querySelector('#ob-b').onclick=()=>goStep(S.demo||!Object.keys(S.days).length?1:1);
    v.querySelector('#ob-n').onclick=()=>{if(!OB.areas.length){toast(_('needArea'));return}const key=OB.areas.join()+'|'+LANG;if(key!==OB.key){OB.items=buildItems(OB.areas,0,OB.items||[]);OB.key=key}goStep(3)};
    return;
  }
  v.innerHTML=`<div class="onb"><div class="headrow rise"><div><div class="eyebrow">${_('step2')}</div><h1 class="ttl">${_('setTtl')}</h1></div>${back}</div>
   <div id="pkb" style="display:flex;flex-direction:column;gap:8px"></div>
   <p class="info">${_('setInfo')}</p>
   <div class="obbar"><button class="btn black" id="ob-n">${_('done')}</button>${dots}</div></div>`;
  bindPk(v.querySelector('#pkb'),OB.items,0,true);
  v.querySelector('#ob-b').onclick=()=>goStep(2);
  v.querySelector('#ob-n').onclick=()=>{
    const on=OB.items.filter(i=>i.on),cs=on.filter(i=>i.k==='c'),rs=on.filter(i=>i.k==='r');
    if(!cs.length){toast(_('needCard'));return}
    const t36=Date.now().toString(36),theme=S.theme||{accent:0,mode:'light'};
    S={v:2,lang:LANG,theme,areas:[...OB.areas],activities:cs.map((it,i)=>({id:'a'+t36+i,key:it.own?undefined:it.id,name:it.name,icon:it.icon,c:it.c??i%COLORS.length,min:it.min||0})),rituals:rs.map((it,i)=>({id:'r'+t36+i,key:it.own?undefined:it.id,name:it.name,icon:it.icon,days:[...(it.days||ALL)]})),days:{},meta:{created:Date.now(),lastBackup:null}};
    save();view='today';cur=today();calYM=cur.slice(0,7);render(true);scrollTo(0,0);confetti();setTimeout(()=>toast(_('ready')),300);
  };
}
function packSheet(ar){
  const have=new Set([...S.activities,...(S.rituals||[])].map(x=>x.name.toLowerCase()));
  const items=buildItems([ar.id],S.activities.length).filter(it=>!have.has(it.name.toLowerCase()));
  const addArea=()=>{S.areas=[...(S.areas||[]),ar.id]};
  if(!items.length){addArea();save();render();toast(_('added',NM(ar.id)));return}
  sheet({title:_('ideas',NM(ar.id)),body:'<div id="pkb" style="display:flex;flex-direction:column;gap:8px"></div>',
   actions:[{label:_('cancel')},{label:_('add'),kind:'black',fn:()=>{const t36=Date.now().toString(36);addArea();
     items.filter(i=>i.on).forEach((it,i)=>{if(it.k==='c')S.activities.push({id:'a'+t36+i,key:it.id,name:it.name,icon:it.icon,c:it.c??S.activities.length%COLORS.length,min:it.min||0});else{S.rituals=S.rituals||[];S.rituals.push({id:'r'+t36+i,key:it.id,name:it.name,icon:it.icon,days:[...(it.days||ALL)]})}});
     save();render();toast(_('added',NM(ar.id)))}}],
   onOpen:sc=>bindPk(sc.querySelector('#pkb'),items,S.activities.length,false)});
}

/* render */
function render(anim){
  renderTabs();const v=document.getElementById('view');
  document.querySelector('.tabbar').hidden=view==='onb';
  document.title=_('appName');
  ({today:renderToday,month:renderMonth,garden:renderGarden,more:renderMore,onb:renderOnb})[view](v);
  if(anim&&!RM){const cls=view==='onb'&&dir?dir:'enter';v.classList.remove('enter','fwd','bwd');void v.offsetWidth;v.classList.add(cls)}
}
async function init(){
  let s=lsGet();
  if(!s)s=await Promise.race([idbGet(),new Promise(r=>setTimeout(()=>r(null),1500))]);
  else idbGet().then(i=>{if(i&&i.meta&&(i.meta.updated||0)>((s.meta||{}).updated||0)){S=migrate(i);LANG=S.lang;relabel();lsSet(S);applyTheme();render()}});
  if(s&&s.days){S=migrate(s);LANG=S.lang;relabel();save()}
  else{const nl=(navigator.language||'pl').slice(0,2).toLowerCase();LANG=nl==='uk'||nl==='ru'?'uk':nl==='pl'?'pl':'en';S=demo();S.lang=LANG;view='onb';OB={step:0,areas:[],items:null,key:''}}
  applyTheme();render(true);
}
init();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
